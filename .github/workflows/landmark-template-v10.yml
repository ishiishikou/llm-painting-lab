name: landmark-template-v10

on:
  pull_request:
    paths:
      - 'tools/generate_landmark_templates_v10.py'
      - 'tools/render_v10_debug_artifacts.py'
      - 'vision/v9-state.json'
      - 'vision/v10-state.json'
      - '.github/workflows/landmark-template-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose-landmark-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow 'opencv-python-headless==4.13.0.92'

      - name: Verify semantic intent has no authored coordinates
        run: |
          python -m py_compile tools/generate_landmark_templates_v10.py tools/render_v10_debug_artifacts.py
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('vision/v10-state.json').read_text())
          forbidden={'x','y','x1','y1','x2','y2','bbox','points','segments','angle_deg','angle','anchor'}
          def walk(v,path='intent_card'):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k in forbidden:
                          raise SystemExit(f'v10 reviewer intent contains low-level geometry: {path}.{k}')
                      walk(x,path+'.'+k)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f'{path}[{i}]')
          walk(state.get('intent_card',{}))
          PY

      - name: Download public-domain reference
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Cache proven v7 stroke source
        id: cache-v7
        uses: actions/cache@v4
        with:
          path: artifact/v7
          key: v7-foldfield-source-20260908-v1

      - name: Recreate proven v7 stroke source
        if: steps.cache-v7.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifact/v7
          python tools/generate_observe_act_v7_foldfield.py reference.jpg \
            --output artifact/v7/strokes.generated.json \
            --preview artifact/v7/preview.png \
            --metrics artifact/v7/metrics.json \
            --observation-log artifact/v7/observation-log.json \
            --width 864 --height 1024

      - name: Generate landmark-anchored template candidates
        run: |
          test -s artifact/v7/strokes.generated.json
          mkdir -p artifact/v10
          python tools/generate_landmark_templates_v10.py \
            artifact/v7/strokes.generated.json \
            vision/v9-state.json \
            vision/v10-state.json \
            reference.jpg \
            --out-dir artifact/v10
          cp vision/v9-state.json artifact/v10/v9-state.json
          cp vision/v10-state.json artifact/v10/v10-state.json

      - name: Export exact detector reference and landmark overlay
        run: |
          python tools/render_v10_debug_artifacts.py \
            reference.jpg artifact/v10/current.png artifact/v10/landmarks.json \
            --out-dir artifact/v10
          python - <<'PY'
          import cv2, json
          from pathlib import Path
          p=Path('artifact/v10/landmarks.json')
          data=json.loads(p.read_text())
          data['opencv_version']=cv2.__version__
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Verify candidate geometry provenance
        run: |
          test -s artifact/v10/reference.png
          test -s artifact/v10/landmark-overlay.png
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifact/v10/candidate-manifest.json').read_text())
          lm=json.loads(Path('artifact/v10/landmarks.json').read_text())
          if lm.get('opencv_version') != '4.13.0':
              raise SystemExit(f'unexpected OpenCV version: {lm.get("opencv_version")}')
          if m.get('coordinates_authored_by_reviewer') is not False:
              raise SystemExit('reviewer coordinates must remain disabled')
          if m.get('reference_used_for_landmark_detection') is not True:
              raise SystemExit('landmark detection provenance missing')
          if m.get('reference_pixels_used_for_template_ranking') is not False:
              raise SystemExit('reference pixels must not rank template shapes')
          if m.get('candidate_count',0) < 1:
              raise SystemExit('no candidate templates generated')
          for c in m['candidates']:
              if c['anchor_distance'] > 0.01:
                  raise SystemExit(f'candidate not anchored to detected landmark: {c}')
              if c['max_geometry_error'] > 0.001:
                  raise SystemExit(f'template geometry changed beyond translation: {c}')
              if not c.get('source_stroke_ids'):
                  raise SystemExit(f'missing v7 provenance: {c}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: landmark-template-v10
          path: artifact/v10/
          if-no-files-found: error
          retention-days: 14

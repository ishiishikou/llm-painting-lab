name: reference-demo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install --disable-pip-version-check pillow imageio imageio-ffmpeg numpy

      - name: Check implementations and rules
        run: |
          python -m py_compile tools/reference_to_brush_process.py tools/generate_direction_field_v5.py tools/render_brush_motion_video.py
          node --check src/brushes.js
          test -s docs/painting-tool-rules.md
          test -s docs/painting-evaluation-rules.md

      - name: Download public-domain reference
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Generate direction-field v5 process
        run: |
          mkdir -p artifact/src artifact/checkpoints
          python tools/generate_direction_field_v5.py reference.jpg \
            --output artifact/strokes.generated.json \
            --preview artifact/preview.png \
            --metrics artifact/metrics.json \
            --checkpoint-dir artifact/checkpoints \
            --width 864 --height 1024 --detail 14000 --finish 7000
          cp artifact/strokes.generated.json artifact/strokes.painterly.json

      - name: Render replay
        run: |
          python tools/render_brush_motion_video.py artifact/strokes.generated.json \
            --output artifact/replay-direction-field.mp4 \
            --seconds 90 --fps 12 --width 640

      - name: Verify stages, tools, and direction field
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data=json.loads(Path('artifact/strokes.generated.json').read_text())
          strokes=data['strokes']
          expected=['composition','silhouette','light_shadow','face_structure','detail','finish']
          actual=[]
          for s in strokes:
              if not actual or actual[-1]!=s['phase']:
                  actual.append(s['phase'])
          phases=Counter(s['phase'] for s in strokes)
          brushes=Counter(s['brush'] for s in strokes)
          masked=sum(1 for s in strokes if s.get('clipBox'))
          direction=data['metadata']['direction_stats']
          print('phase order:',actual)
          print('phase counts:',dict(phases))
          print('brush counts:',dict(brushes))
          print('masked:',masked)
          print('direction:',direction)

          if actual!=expected or data['metadata'].get('phase_order')!=expected:
              raise SystemExit('6工程の順序が不正です')
          if data['metadata'].get('background_policy')!='toned-ground-no-progress':
              raise SystemExit('背景が地塗り扱いになっていません')
          if data['metadata'].get('tool_policy')!='docs/painting-tool-rules.md':
              raise SystemExit('道具ルールへの参照がありません')
          if data['metadata'].get('evaluation_policy')!='docs/painting-evaluation-rules.md':
              raise SystemExit('評価ルールへの参照がありません')
          if data['metadata'].get('direction_policy')!='region-form-following-v5':
              raise SystemExit('部位別方向場が有効ではありません')

          if len(strokes)<20000: raise SystemExit('ストローク数が少なすぎます')
          if phases['composition']>20: raise SystemExit('構図工程が細かすぎます')
          if phases['silhouette']<350: raise SystemExit('大きな形が不足しています')
          if phases['light_shadow']<1500: raise SystemExit('明暗工程が不足しています')
          if phases['face_structure']<800: raise SystemExit('顔構造が不足しています')
          if phases['detail']<9000: raise SystemExit('細部が不足しています')
          if phases['finish']<5000: raise SystemExit('仕上げが不足しています')

          required={'dryBrush':1200,'flatBrush':1000,'variableBrush':2000,'mixerBrush':200,'smudgeBrush':80,'glaze':20}
          for brush,minimum in required.items():
              if brushes[brush]<minimum:
                  raise SystemExit(f'{brush}不足: {brushes[brush]} < {minimum}')
          if masked<1500: raise SystemExit('Mask相当の範囲制御が不足しています')
          if any(s.get('brush')=='ellipse' for s in strokes): raise SystemExit('円形スタンプが残っています')
          if any('image' in str(s).lower() for s in strokes): raise SystemExit('画像参照が含まれています')

          if any(s['phase']=='composition' and s['brush'] in {'mixerBrush','smudgeBrush','glaze'} for s in strokes):
              raise SystemExit('構図工程で混色系道具を使用しています')
          if any(s['phase']=='silhouette' and s['brush'] in {'smudgeBrush','glaze'} for s in strokes):
              raise SystemExit('大きな形工程でSmudge/Glazeを使用しています')
          if any(s['phase']=='detail' and s['brush'] in {'smudgeBrush','glaze'} for s in strokes):
              raise SystemExit('細部工程で広域調整系道具を使用しています')
          if not any(s['phase']=='finish' and s['brush']=='glaze' for s in strokes):
              raise SystemExit('仕上げでGlazeが使われていません')

          overall=direction['all']
          if overall['count']<1000: raise SystemExit('方向場を評価する広筆が不足しています')
          if overall['dominant_share']>=.34: raise SystemExit(f'広筆が1方向へ集中: {overall}')
          if overall['active_bins']<6: raise SystemExit(f'広筆方向が単調: {overall}')
          for role in ['face','headwrap','garment']:
              stats=direction[role]
              if stats['count']>=100 and stats['active_bins']<3:
                  raise SystemExit(f'{role}の方向分布が単調: {stats}')

          final=json.loads(Path('artifact/metrics.json').read_text())['checkpoints'][-1]
          print('final:',final)
          if final['mae']>=18: raise SystemExit('MAEが大きすぎます')
          if final['psnr']<=18: raise SystemExit('PSNRが低すぎます')

          for name in ['01-composition.png','02-silhouette.png','03-light-shadow.png','04-face-structure.png','05-detail.png','06-finish.png']:
              if not (Path('artifact/checkpoints')/name).exists(): raise SystemExit(f'チェックポイントなし: {name}')
          if not Path('artifact/replay-direction-field.mp4').exists(): raise SystemExit('リプレイ動画がありません')
          PY

      - name: Package artifact
        run: |
          cp index.html styles.css artifact/
          cp src/app.js src/brushes.js artifact/src/
          cp strokes.json artifact/strokes.json
          cp docs/painting-tool-rules.md artifact/painting-tool-rules.md
          cp docs/painting-evaluation-rules.md artifact/painting-evaluation-rules.md
          gzip -k artifact/strokes.generated.json
          cat > artifact/README.txt <<'TXT'
          部位別方向場 v5 の成果物です。

          顔は「全体を楕円状に回す」のではなく、額・頬・顎の面を分け、
          顔構造以降だけ目=横、鼻筋=縦、口=横を補助します。
          ターバンは冠部の巻き方向と垂れ布の縦方向、衣服は重力方向を基準にします。

          また、細部と仕上げの総量をv4より減らし、重要部へ重点配分しています。

          checkpoints/: 各工程終了時点
          preview.png: 完成画像
          strokes.generated.json: 描画順・道具・方向統計
          replay-direction-field.mp4: 描画リプレイ
          painting-tool-rules.md: 工程×部位×道具ルール
          painting-evaluation-rules.md: 評価基準
          metrics.json: 品質指標と方向統計
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: direction-field-demo
          path: artifact/
          if-no-files-found: error
          retention-days: 14

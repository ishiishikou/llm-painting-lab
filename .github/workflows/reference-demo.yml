name: reference-demo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install --disable-pip-version-check pillow imageio imageio-ffmpeg numpy

      - name: Check implementations and rules
        run: |
          python -m py_compile tools/reference_to_brush_process.py tools/generate_direction_field_v5.py tools/generate_artifact_cleanup_v6.py tools/generate_observe_act_v7.py tools/generate_observe_act_v7_hybrid.py tools/generate_observe_act_v7_final.py tools/generate_observe_act_v7_foldfield.py tools/render_brush_motion_video.py
          node --check src/brushes.js
          test -s docs/painting-tool-rules.md
          test -s docs/painting-evaluation-rules.md

      - name: Download public-domain reference
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Generate observe-act v7 process
        run: |
          mkdir -p artifact/src artifact/checkpoints
          python tools/generate_observe_act_v7_foldfield.py reference.jpg \
            --output artifact/strokes.generated.json \
            --preview artifact/preview.png \
            --metrics artifact/metrics.json \
            --observation-log artifact/observation-log.json \
            --checkpoint-dir artifact/checkpoints \
            --width 864 --height 1024
          cp artifact/strokes.generated.json artifact/strokes.painterly.json

      - name: Render replay
        run: |
          python tools/render_brush_motion_video.py artifact/strokes.generated.json \
            --output artifact/replay-observe-act.mp4 \
            --seconds 90 --fps 12 --width 640

      - name: Package artifact
        run: |
          cp index.html styles.css artifact/
          cp src/app.js src/brushes.js artifact/src/
          cp strokes.json artifact/strokes.json
          cp docs/painting-tool-rules.md artifact/painting-tool-rules.md
          cp docs/painting-evaluation-rules.md artifact/painting-evaluation-rules.md
          gzip -k artifact/strokes.generated.json
          cat > artifact/README.txt <<'TXT'
          observe-act v7 の成果物です。

          大きな形と中間サイズの明暗面は、規則的な格子を露出させず、位置・長さ・太さ・方向を
          部位の形に沿って変えながら粗い作業領域ごとにブロックインします。衣服は単一の縦方向
          ではなく複数の連続した折り目方向場で塗り、塗りの途中には Mixer / Smudge を挟みます。

          その後は「現在の絵を見る→問題のある部位と目的を一つ決める→パレットで色を作る→
          近接した4〜7筆を描く→もう一度見る」という短い作業単位を反復します。
          detail / finish でも全画面候補を一括生成せず、各サイクルでその時点のキャンバスを
          再評価します。同じpaintLoadIdは同じ絵具を筆につけたまま作業する単位です。

          observation-log.json: 各サイクルの観察・判断・前後スコア
          strokes.generated.json: decisionCycle / paintRun / paintLoadIdを含む描画データ
          checkpoints/: 6工程の終了時点
          preview.png: 完成画
          replay-observe-act.mp4: 描画リプレイ
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: observe-act-v7
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Verify observe-act behavior
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data=json.loads(Path('artifact/strokes.generated.json').read_text())
          metrics=json.loads(Path('artifact/metrics.json').read_text())
          decisions=json.loads(Path('artifact/observation-log.json').read_text())['decisions']
          strokes=data['strokes']; meta=data['metadata']
          expected=['composition','silhouette','light_shadow','face_structure','detail','finish']
          actual=[]
          for s in strokes:
              if not actual or actual[-1]!=s['phase']: actual.append(s['phase'])
          phases=Counter(s['phase'] for s in strokes)
          brushes=Counter(s['brush'] for s in strokes)
          cycle_strokes=Counter(s['decisionCycle'] for s in strokes if s.get('decisionCycle'))
          loads=Counter(s['paintLoadId'] for s in strokes if s.get('paintLoadId'))
          regions=Counter(d['region'] for d in decisions)
          intents=Counter(d['intent'] for d in decisions)
          artifact=meta['artifact_checks']
          direction=meta['direction_stats']
          print('phase order:',actual)
          print('phase counts:',dict(phases))
          print('brush counts:',dict(brushes))
          print('decision regions:',dict(regions))
          print('decision intents:',dict(intents))
          print('paint loads:',len(loads),'cycles:',len(decisions))
          print('direction:',direction)
          print('final:',metrics['checkpoints'][-1])

          if actual!=expected or meta.get('phase_order')!=expected: raise SystemExit('6工程の順序が不正')
          if meta.get('observe_act_policy')!='broad-block-in-then-observe-local-run-reobserve-v7': raise SystemExit('観察判断ループが無効')
          if meta.get('palette_policy')!='persistent-local-mixed-load-v7': raise SystemExit('パレット状態保持が無効')
          if meta.get('block_in_policy')!='jittered-clustered-form-flow-with-wet-transitions-v7': raise SystemExit('ブロックインの有機化が無効')
          if meta.get('artifact_policy')!='no-hard-rectangular-face-mask-v6': raise SystemExit('v6の顔artifact対策が失われた')
          if artifact['face_role_hard_clip_count']!=0 or artifact['exact_face_bbox_clip_count']!=0: raise SystemExit(f'顔矩形clipが再発: {artifact}')

          if len(decisions)<220: raise SystemExit(f'観察サイクル不足: {len(decisions)}')
          if len(regions)<4: raise SystemExit(f'観察対象が偏りすぎ: {regions}')
          if len(intents)<3: raise SystemExit(f'判断種別が単調: {intents}')
          if not cycle_strokes or max(cycle_strokes.values())>90: raise SystemExit(f'1回に描きすぎ: {cycle_strokes.most_common(3)}')
          if not loads or max(loads.values())<4: raise SystemExit('同じ絵具を複数筆使う状態がない')
          if len(loads)>=sum(loads.values())*.72: raise SystemExit('ほぼ毎筆で色を付け直している')

          if phases['detail']>=14000: raise SystemExit('細部が単一大量復元へ戻っている')
          if phases['finish']>=8000: raise SystemExit('仕上げが単一大量復元へ戻っている')
          if len(strokes)>=28000: raise SystemExit('総ストロークが過剰')
          required={'dryBrush':900,'flatBrush':1200,'variableBrush':3500,'mixerBrush':180,'smudgeBrush':20,'glaze':20}
          for b,n in required.items():
              if brushes[b]<n: raise SystemExit(f'{b}不足: {brushes[b]} < {n}')
          if any(s.get('brush')=='ellipse' for s in strokes): raise SystemExit('円形スタンプが残っている')
          if any('image' in str(s).lower() for s in strokes): raise SystemExit('画像貼り付け参照がある')

          garment=direction['garment']
          if garment['dominant_share']>=.36: raise SystemExit(f'衣服の筆方向が単調: {garment}')
          if garment['active_bins']<5: raise SystemExit(f'衣服の筆方向の広がり不足: {garment}')
          if direction['all']['active_bins']<8: raise SystemExit(f'全体の方向分布が狭い: {direction["all"]}')

          final=metrics['checkpoints'][-1]
          if final['mae']>=14.5: raise SystemExit(f'MAEが大きすぎる: {final}')
          if final['psnr']<=20: raise SystemExit(f'PSNRが低すぎる: {final}')
          for name in ['01-composition.png','02-silhouette.png','03-light-shadow.png','04-face-structure.png','05-detail.png','06-finish.png']:
              if not (Path('artifact/checkpoints')/name).exists(): raise SystemExit(f'checkpointなし: {name}')
          if not Path('artifact/replay-observe-act.mp4').exists(): raise SystemExit('リプレイなし')
          PY

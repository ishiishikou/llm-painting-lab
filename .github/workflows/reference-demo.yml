name: reference-demo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install --disable-pip-version-check pillow imageio imageio-ffmpeg numpy

      - name: Download public-domain reference
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Generate strokes in actual human painting order
        run: |
          mkdir -p artifact/src artifact/checkpoints
          python tools/reference_to_human_strokes.py reference.jpg \
            --output artifact/strokes.generated.json \
            --preview artifact/preview.png \
            --metrics artifact/metrics.json \
            --checkpoint-dir artifact/checkpoints \
            --width 864 \
            --height 1024 \
            --detail 45000 \
            --finish 30000
          cp artifact/strokes.generated.json artifact/strokes.painterly.json

      - name: Render slow replay video with Japanese progress text
        run: |
          python tools/render_replay_video.py artifact/strokes.generated.json \
            --output artifact/replay-human-order.mp4 \
            --seconds 82 \
            --fps 10 \
            --width 640

      - name: Verify the six stages are real ordered stroke blocks
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path('artifact/strokes.generated.json').read_text())
          strokes = data['strokes']
          expected = [
              'composition',
              'silhouette',
              'light_shadow',
              'face_structure',
              'detail',
              'finish',
          ]

          actual = []
          for stroke in strokes:
              phase = stroke['phase']
              if not actual or actual[-1] != phase:
                  actual.append(phase)

          counts = Counter(stroke['phase'] for stroke in strokes)
          print('phase order:', actual)
          print('phase counts:', dict(counts))
          print('total strokes:', len(strokes))

          if actual != expected:
              raise SystemExit(f'6工程の実描画順が不正です: {actual}')
          if data['metadata'].get('phase_order') != expected:
              raise SystemExit('metadata.phase_order が6工程と一致しません')
          if len(strokes) < 90000:
              raise SystemExit('ストローク数が9万未満です')
          if counts['composition'] > 100:
              raise SystemExit('構図工程が細かすぎます')
          if counts['silhouette'] < 400:
              raise SystemExit('シルエット工程の大きな形が不足しています')
          if counts['light_shadow'] < 12000:
              raise SystemExit('明暗の面工程が不足しています')
          if counts['face_structure'] < 2000:
              raise SystemExit('顔構造工程が不足しています')
          if counts['detail'] < 40000:
              raise SystemExit('細部工程が不足しています')
          if counts['finish'] < 25000:
              raise SystemExit('仕上げ工程が不足しています')
          if any('image' in str(stroke).lower() for stroke in strokes):
              raise SystemExit('生成ストローク内に画像参照が含まれています')

          metrics = json.loads(Path('artifact/metrics.json').read_text())['checkpoints']
          final = metrics[-1]
          print('final metrics:', final)
          if final['mae'] >= 15:
              raise SystemExit('完成画像のMAEが大きすぎます')
          if final['psnr'] <= 20:
              raise SystemExit('完成画像のPSNRが低すぎます')

          expected_checkpoints = [
              '01-composition.png',
              '02-silhouette.png',
              '03-light-shadow.png',
              '04-face-structure.png',
              '05-detail.png',
              '06-finish.png',
          ]
          for name in expected_checkpoints:
              if not (Path('artifact/checkpoints') / name).exists():
                  raise SystemExit(f'チェックポイントがありません: {name}')

          if not Path('artifact/replay-human-order.mp4').exists():
              raise SystemExit('リプレイ動画が生成されていません')
          PY

      - name: Package replay viewer
        run: |
          cp index.html styles.css artifact/
          cp src/app.js src/brushes.js artifact/src/
          cp strokes.json artifact/strokes.json
          gzip -k artifact/strokes.generated.json
          cat > artifact/README.txt <<'TXT'
          人間の描画順を模した参照画像ガイド描画の成果物です。

          今回は、完成後にストロークを並べ替えているのではありません。
          ストローク生成そのものを以下の6工程に分離しています。

          1. 構図
          2. シルエット
          3. 明暗の面
          4. 顔構造
          5. 細部
          6. 仕上げ

          checkpoints/:
            各工程が終わった時点の画像です。
            実際に上記の順で絵が立ち上がっていることを確認できます。

          preview.png:
            最終完成画像。

          strokes.generated.json:
            6工程の順で生成された全ストロークデータ。

          replay-human-order.mp4:
            日本語進捗表示付きのゆっくり描画リプレイ。

          metrics.json:
            工程ごとのストローク数と最終品質指標。

          Webビューア:
            このフォルダをHTTPサーバーで公開し、
            /?mode=generated を開くと同じストロークを再生できます。
          TXT

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-painting-order-demo
          path: artifact/
          if-no-files-found: error
          retention-days: 14

name: reference-demo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install --disable-pip-version-check pillow imageio imageio-ffmpeg numpy

      - name: Download public-domain reference
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Generate brush-motion painting process
        run: |
          mkdir -p artifact/src artifact/checkpoints
          python tools/reference_to_brush_process.py reference.jpg \
            --output artifact/strokes.generated.json \
            --preview artifact/preview.png \
            --metrics artifact/metrics.json \
            --checkpoint-dir artifact/checkpoints \
            --width 864 \
            --height 1024 \
            --detail 18000 \
            --finish 10000
          cp artifact/strokes.generated.json artifact/strokes.painterly.json

      - name: Render replay with visible brush motion
        run: |
          python tools/render_brush_motion_video.py artifact/strokes.generated.json \
            --output artifact/replay-brush-motion.mp4 \
            --seconds 90 \
            --fps 12 \
            --width 640

      - name: Verify painter-like stages and brush usage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path('artifact/strokes.generated.json').read_text())
          strokes = data['strokes']
          expected = [
              'composition',
              'silhouette',
              'light_shadow',
              'face_structure',
              'detail',
              'finish',
          ]

          actual = []
          for stroke in strokes:
              phase = stroke['phase']
              if not actual or actual[-1] != phase:
                  actual.append(phase)

          phase_counts = Counter(stroke['phase'] for stroke in strokes)
          brush_counts = Counter(stroke['brush'] for stroke in strokes)
          print('phase order:', actual)
          print('phase counts:', dict(phase_counts))
          print('brush counts:', dict(brush_counts))
          print('total strokes:', len(strokes))

          if actual != expected:
              raise SystemExit(f'6工程の実描画順が不正です: {actual}')
          if data['metadata'].get('phase_order') != expected:
              raise SystemExit('metadata.phase_order が6工程と一致しません')
          if data['metadata'].get('background_policy') != 'toned-ground-no-progress':
              raise SystemExit('背景が地塗り扱いになっていません')
          if len(strokes) < 28000:
              raise SystemExit('ストローク数が少なすぎます')
          if phase_counts['composition'] > 20:
              raise SystemExit('構図工程が細かすぎます')
          if phase_counts['silhouette'] < 350:
              raise SystemExit('大きな形のブロックインが不足しています')
          if phase_counts['light_shadow'] < 1200:
              raise SystemExit('明暗の面工程が不足しています')
          if phase_counts['face_structure'] < 800:
              raise SystemExit('顔構造工程が不足しています')
          if phase_counts['detail'] < 15000:
              raise SystemExit('細部工程が不足しています')
          if phase_counts['finish'] < 8000:
              raise SystemExit('仕上げ工程が不足しています')
          if brush_counts['dryBrush'] < 1200:
              raise SystemExit('太筆・かすれ筆の使用量が不足しています')
          if any(stroke.get('brush') == 'ellipse' for stroke in strokes):
              raise SystemExit('円形スタンプが残っています')
          if any('image' in str(stroke).lower() for stroke in strokes):
              raise SystemExit('生成ストローク内に画像参照が含まれています')

          metrics = json.loads(Path('artifact/metrics.json').read_text())['checkpoints']
          final = metrics[-1]
          print('final metrics:', final)
          if final['mae'] >= 18:
              raise SystemExit('完成画像のMAEが大きすぎます')
          if final['psnr'] <= 18:
              raise SystemExit('完成画像のPSNRが低すぎます')

          for name in [
              '01-composition.png',
              '02-silhouette.png',
              '03-light-shadow.png',
              '04-face-structure.png',
              '05-detail.png',
              '06-finish.png',
          ]:
              if not (Path('artifact/checkpoints') / name).exists():
                  raise SystemExit(f'チェックポイントがありません: {name}')

          if not Path('artifact/replay-brush-motion.mp4').exists():
              raise SystemExit('筆運びリプレイ動画が生成されていません')
          PY

      - name: Package replay viewer
        run: |
          cp index.html styles.css artifact/
          cp src/app.js src/brushes.js artifact/src/
          cp strokes.json artifact/strokes.json
          gzip -k artifact/strokes.generated.json
          cat > artifact/README.txt <<'TXT'
          公開されている油彩制作過程を参考にした、筆運び主体の描画成果物です。

          1. 構図
          2. 下塗り + 大きな形
          3. 明暗と色面
          4. 顔構造
          5. 細部
          6. 仕上げ

          序盤では色の四角いパッチを貼る方式を使わず、dryBrush による
          長く太い筆致を重ねます。大きな形では暖色の下塗りを挟んでから
          本来の色を置き、油彩のブロックインに近い進み方を狙います。

          replay-brush-motion.mp4 は、主要ストロークを瞬間表示せず、
          筆先が始点から終点へ移動して見えるよう途中状態を描画します。
          背景は地塗りとして最初から置き、背景更新で動画時間を消費しません。

          checkpoints/: 各工程終了時点の画像
          preview.png: 最終完成画像
          strokes.generated.json: 実際の描画順のストロークデータ
          metrics.json: 工程ごとの品質指標
          TXT

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: brush-motion-demo
          path: artifact/
          if-no-files-found: error
          retention-days: 14

name: stroke-vocabulary-v9

on:
  pull_request:
    paths:
      - 'tools/generate_stroke_candidates_v9.py'
      - 'vision/v9-state.json'
      - 'docs/stroke-vocabulary-v9.md'
      - '.github/workflows/stroke-vocabulary-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose-strokes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify v9 intent contains no authored coordinates
        run: |
          python -m py_compile tools/generate_stroke_candidates_v9.py
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('vision/v9-state.json').read_text())
          forbidden={'x','y','x1','y1','x2','y2','bbox','points','segments','angle_deg','angle'}
          def walk(v,path='state'):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k in forbidden:
                          raise SystemExit(f'AI intent contains low-level coordinate field: {path}.{k}')
                      walk(x,path+'.'+k)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f'{path}[{i}]')
          walk(state.get('intent_card',{}))
          PY

      - name: Download public-domain reference
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Cache proven v7 stroke source
        id: cache-v7
        uses: actions/cache@v4
        with:
          path: artifact/v7
          key: v7-foldfield-source-20260908-v1

      - name: Recreate proven v7 stroke source
        if: steps.cache-v7.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifact/v7
          python tools/generate_observe_act_v7_foldfield.py reference.jpg \
            --output artifact/v7/strokes.generated.json \
            --preview artifact/v7/preview.png \
            --metrics artifact/v7/metrics.json \
            --observation-log artifact/v7/observation-log.json \
            --width 864 --height 1024

      - name: Verify cached/generated v7 source
        run: |
          test -s artifact/v7/strokes.generated.json
          mkdir -p artifact/v9

      - name: Propose coordinate-free v9 candidates
        run: |
          python tools/generate_stroke_candidates_v9.py \
            artifact/v7/strokes.generated.json vision/v9-state.json \
            --out-dir artifact/v9
          cp vision/v9-state.json artifact/v9/v9-state.json
          cp docs/stroke-vocabulary-v9.md artifact/v9/stroke-vocabulary-v9.md

      - name: Build visual review board
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from PIL import Image, ImageDraw
          import sys
          sys.path.insert(0,'tools')
          import reference_to_brush_process as base

          manifest=json.loads(Path('artifact/v9/candidate-manifest.json').read_text())
          current=Image.open('artifact/v9/current.png').convert('RGB')
          ref=base.crop_resize(Image.open('reference.jpg'),current.width,current.height)
          labels=[c['label'] for c in manifest['candidates']]
          images=[('REFERENCE',ref),('CURRENT',current)]
          for label in labels:
              images.append((f'CANDIDATE {label}',Image.open(f'artifact/v9/candidate-{label}.png').convert('RGB')))

          cols=3
          rows=math.ceil(len(images)/cols)
          scale=.34 if rows <= 2 else .27
          tw,th=round(current.width*scale),round(current.height*scale)
          cell_h=th+34
          board=Image.new('RGB',(tw*cols,cell_h*rows),(238,238,238))
          d=ImageDraw.Draw(board)
          for i,(label,im) in enumerate(images):
              x=(i%cols)*tw; y=(i//cols)*cell_h
              board.paste(im.resize((tw,th)),(x,y+34))
              d.text((x+8,y+9),label,fill='black')
          board.save('artifact/v9/review-board.png')

          metrics={'current':base.metrics(ref,current),'candidates':{}}
          for label in labels:
              im=Image.open(f'artifact/v9/candidate-{label}.png').convert('RGB')
              metrics['candidates'][label]=base.metrics(ref,im)
          Path('artifact/v9/evaluation-only.json').write_text(json.dumps(metrics,indent=2))
          PY

      - name: Verify candidate provenance and size
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifact/v9/candidate-manifest.json').read_text())
          if m.get('reference_used_for_candidate_selection') is not False:
              raise SystemExit('candidate selection must not use reference pixels')
          if m.get('coordinates_authored_by_reviewer') is not False:
              raise SystemExit('reviewer coordinates must remain disabled')
          if m.get('base_stroke_count',0) < 1500:
              raise SystemExit('frozen broad-painting base is unexpectedly small')
          expected=int(m['intent_card'].get('candidate_count',3))
          if len(m.get('candidates',[])) != expected:
              raise SystemExit(f'candidate count mismatch: {len(m.get("candidates",[]))} != {expected}')
          minn=int(m['intent_card'].get('min_strokes_per_candidate',1))
          maxn=int(m['intent_card'].get('max_strokes_per_candidate',7))
          for c in m['candidates']:
              if not (minn <= c['stroke_count'] <= maxn):
                  raise SystemExit(f'candidate size outside requested passage: {c}')
              if not c.get('source_stroke_ids') or any(x is None for x in c['source_stroke_ids']):
                  raise SystemExit(f'candidate is not traceable to v7 strokes: {c}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stroke-vocabulary-v9
          path: artifact/v9/
          if-no-files-found: error
          retention-days: 14

name: order-only-v11

on:
  pull_request:
    paths:
      - 'tools/reorder_full_stroke_set_v11.py'
      - 'vision/v11-order.json'
      - '.github/workflows/order-only-v11.yml'
      - 'tools/generate_artifact_cleanup_v6.py'
      - 'tools/render_brush_motion_video.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reorder-complete-painting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU landmark and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg libegl1 libgl1 libgles2
          python -m pip install --disable-pip-version-check pillow numpy mediapipe imageio imageio-ffmpeg
          python - <<'PY'
          import mediapipe as mp
          print('mediapipe', getattr(mp, '__version__', 'unknown'))
          PY

      - name: Verify order-only invariants in config
        run: |
          python -m py_compile tools/reorder_full_stroke_set_v11.py tools/generate_artifact_cleanup_v6.py tools/render_brush_motion_video.py
          python - <<'PY'
          import json
          c=json.load(open('vision/v11-order.json'))
          q=c['constraints']
          required={
            'all_source_strokes_required':True,
            'selection_allowed':False,
            'rejection_allowed':False,
            'geometry_changes_allowed':False,
            'color_changes_allowed':False,
            'brush_changes_allowed':False,
            'final_equivalence_required':True,
          }
          for k,v in required.items():
              if q.get(k) is not v: raise SystemExit(f'order-only invariant violated: {k}={q.get(k)}')
          if c.get('mode')!='order-only': raise SystemExit('mode must be order-only')
          PY

      - name: Download public-domain reference
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Download current MediaPipe Face Landmarker model
        run: |
          curl -L --fail --retry 3 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task' \
            -o face_landmarker.task
          test -s face_landmarker.task

      - name: Recreate the complete high-quality v6 stroke set
        run: |
          mkdir -p artifact/v6 artifact/v11
          python tools/generate_artifact_cleanup_v6.py reference.jpg \
            --output artifact/v6/strokes.generated.json \
            --preview artifact/v6/preview.png \
            --metrics artifact/v6/metrics.json \
            --width 864 --height 1024
          test -s artifact/v6/strokes.generated.json
          test -s artifact/v6/preview.png

      - name: Reorder all strokes only
        run: |
          python tools/reorder_full_stroke_set_v11.py \
            artifact/v6/strokes.generated.json \
            reference.jpg \
            face_landmarker.task \
            vision/v11-order.json \
            --out-dir artifact/v11
          cp vision/v11-order.json artifact/v11/v11-order.json
          cp artifact/v6/metrics.json artifact/v11/source-v6-metrics.json

      - name: Render reordered replay
        run: |
          python tools/render_brush_motion_video.py artifact/v11/strokes.reordered.json \
            --output artifact/v11/replay-order-only.mp4 \
            --seconds 90 --fps 12 --width 640

      - name: Verify complete-set and final-image equivalence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('artifact/v11/equivalence.json').read_text())
          if not e.get('stroke_multiset_identical'): raise SystemExit('stroke set changed')
          if not e.get('final_raster_identical'): raise SystemExit('final raster changed')
          if e.get('max_final_pixel_difference') != 0: raise SystemExit(f'final pixel difference: {e}')
          if e['source_stroke_count'] != e['output_stroke_count']: raise SystemExit('stroke count changed')
          if e.get('landmark_engine') != 'MediaPipe Face Landmarker': raise SystemExit('modern Face Landmarker not active')
          for name in ['final.png','original-final.png','reference.png','landmark-overlay.png','order-checkpoints.png','replay-order-only.mp4','strokes.reordered.json']:
              if not (Path('artifact/v11')/name).exists(): raise SystemExit(f'missing artifact: {name}')
          print(json.dumps(e,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: order-only-v11
          path: artifact/v11/
          if-no-files-found: error
          retention-days: 14

name: vision-guided-v8

on:
  pull_request:
    paths:
      - 'tools/generate_vision_guided_v8.py'
      - 'tools/generate_vision_guided_v8_rounds.py'
      - 'vision/v8-plan.json'
      - 'vision/v8-rounds/**'
      - 'docs/vision-guided-v8.md'
      - '.github/workflows/vision-guided-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review-round:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify v8 generator cannot inspect reference pixels
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/reference_to_brush_process.py tools/generate_vision_guided_v8.py tools/generate_vision_guided_v8_rounds.py
          for f in tools/generate_vision_guided_v8.py tools/generate_vision_guided_v8_rounds.py; do
            if grep -Eq 'Image\.open|crop_resize\(|gradient\(|metrics\(' "$f"; then
              echo "$f contains a forbidden reference/image-analysis operation"
              exit 1
            fi
          done
          test -s docs/vision-guided-v8.md
          test -s vision/v8-plan.json

      - name: Download public-domain reference for review only
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -L --fail --retry 3 \
            'https://www.mauritshuis.nl/media/wlola5to/0670_repro_2.jpg' \
            -o reference.jpg; then
            curl -L --fail --retry 3 \
              'https://upload.wikimedia.org/wikipedia/commons/e/e4/Johannes_Vermeer_-_Girl_with_a_Pearl_Earring_-_670_-_Mauritshuis.jpg' \
              -o reference.jpg
          fi
          test -s reference.jpg

      - name: Render current visual-review plan
        run: |
          mkdir -p artifact
          python tools/generate_vision_guided_v8_rounds.py vision/v8-plan.json \
            --output artifact/strokes.generated.json \
            --preview artifact/preview.png
          cp vision/v8-plan.json artifact/v8-plan.json
          if [ -d vision/v8-rounds ]; then cp -R vision/v8-rounds artifact/; fi
          cp docs/vision-guided-v8.md artifact/vision-guided-v8.md

      - name: Build review pair and evaluation-only metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          import sys
          sys.path.insert(0, 'tools')
          import reference_to_brush_process as base

          out=Image.open('artifact/preview.png').convert('RGB')
          ref=base.crop_resize(Image.open('reference.jpg'), out.width, out.height)
          m=base.metrics(ref,out)
          data=json.loads(Path('artifact/strokes.generated.json').read_text())
          meta=data['metadata']
          summary={
            'review_round': meta.get('review_round',0),
            'stroke_count': len(data['strokes']),
            'brush_counts': meta['brush_counts'],
            'phase_counts': meta['phase_counts'],
            'round_files': meta.get('round_files',[]),
            'evaluation_only_metrics': m,
            'generator_reference_access': False,
          }
          Path('artifact/review-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))

          scale=0.58
          rw,rh=round(ref.width*scale),round(ref.height*scale)
          rr=ref.resize((rw,rh)); oo=out.resize((rw,rh))
          pair=Image.new('RGB',(rw*2,rh+42),'white')
          pair.paste(rr,(0,42)); pair.paste(oo,(rw,42))
          d=ImageDraw.Draw(pair)
          d.text((12,12),'REFERENCE',fill='black')
          d.text((rw+12,12),f'CURRENT v8 / review round {meta.get("review_round",0)}',fill='black')
          pair.save('artifact/review-pair.png')
          ref.save('artifact/reference-review.png')
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Verify plan-driven behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('vision/v8-plan.json').read_text())
          data=json.loads(Path('artifact/strokes.generated.json').read_text())
          meta=data['metadata']
          if meta.get('source_mode')!='review-plan-only-no-reference-access':
              raise SystemExit('v8 source mode is not review-plan-only')
          if meta.get('reference_access_in_generator') is not False:
              raise SystemExit('generator reference access must be false')
          if not plan.get('actions'):
              raise SystemExit('visual review base plan is empty')
          if len(data['strokes']) > 2000:
              raise SystemExit('review plan has become too large; stop and visually review sooner')
          for s in data['strokes']:
              if not s.get('reviewActionId'):
                  raise SystemExit('stroke without reviewer action id')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vision-guided-v8
          path: artifact/
          if-no-files-found: error
          retention-days: 14

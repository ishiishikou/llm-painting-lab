<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LLM Painting Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">LLM Painting Lab</p>
      <h1>反復型ストローク描画環境</h1>
      <p class="lede">Canvas は順序付きストロークだけを再生します。参照画像ガイドモードでも、完成画像そのものを Canvas に貼り付けません。</p>
    </header>

    <section class="controls" aria-label="描画操作">
      <button id="play">再生</button>
      <button id="pause">一時停止</button>
      <button id="step">1ストローク進める</button>
      <button id="reset">リセット</button>
      <label>速度
        <input id="speed" type="range" min="1" max="5000" value="800" />
        <output id="speedValue">800</output>/frame
      </label>
      <button id="export">PNG出力</button>
    </section>

    <section class="status-grid">
      <div><span>ストローク</span><strong id="strokeStatus">0 / 0</strong></div>
      <div><span>フェーズ</span><strong id="phaseStatus">—</strong></div>
      <div><span>状態</span><strong id="runStatus">読み込み中</strong></div>
    </section>

    <section class="canvas-frame">
      <canvas id="painting" width="768" height="1024"></canvas>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
